<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Freundschaftsbuch</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>

<body>
  <div class="page-center">
    <div class="card">

      <h1>📖 Freundschaftsbuch</h1>

      <div id="entry">
        <p>Lade Einträge …</p>
      </div>

      <div class="nav">
        <button id="prev">⬅️</button>
        <button id="next">➡️</button>
      </div>

      <a href="index.html" class="button secondary">
        ⬅️ Zur Startseite
      </a>

    </div>
  </div>

<script>
  // ==========================
  // SUPABASE SETUP (ECHT)
  // ==========================
  const SUPABASE_URL = "https://mvladicfytndyekrbzme.supabase.co";
  const SUPABASE_KEY =
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im12bGFkaWNmeXRuZHlla3Jiem1lIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAxMzM4MjksImV4cCI6MjA4NTcwOTgyOX0.eeTXlaU-DYqQqV5h-FaRsTigRvGKLhLVBvNHvCE2DJ4";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  let entries = [];
  let currentIndex = 0;

  // ==========================
  // SPOTIFY EMBED (ROBUST)
  // ==========================
  function spotifyEmbed(url) {
    if (!url) return "";

    const match = url.match(
      /spotify\.com\/(?:intl-[a-z]{2}\/)?(track|album|playlist)\/([a-zA-Z0-9]+)/
    );

    if (!match) return "";

    return `
      <iframe
        src="https://open.spotify.com/embed/${match[1]}/${match[2]}"
        width="100%"
        height="80"
        allow="encrypted-media"
      ></iframe>
    `;
  }

  // ==========================
  // LOAD ENTRIES
  // ==========================

function formatDate(dateString) {
  if (!dateString) return "-";

  const d = new Date(dateString);
  return d.toLocaleDateString("de-DE", {
    day: "2-digit",
    month: "2-digit",
    year: "numeric"
  });
}

  
  async function loadEntries() {
    const { data, error } = await supabaseClient
.from("entries")
.select("*")
.order("created_at", { ascending: false });

    if (error) {
      console.error(error);
      document.getElementById("entry").innerHTML =
        "<p>Fehler beim Laden</p>";
      return;
    }

    if (!data || data.length === 0) {
      document.getElementById("entry").innerHTML =
        "<p>Noch keine Einträge vorhanden.</p>";
      return;
    }

    entries = data;
    currentIndex = 0;
    renderEntry();
  }

  // ==========================
  // RENDER SINGLE ENTRY
  // ==========================
function renderEntry() {
  const e = entries[currentIndex];

  let songHtml = "";
  if (e.song) {
    songHtml = `
      <p style="margin-top:16px; font-weight:bold; text-align:center;">
        🎵 Aktueller Lieblingssong:
      </p>
      ${spotifyEmbed(e.song)}
    `;
  }

  document.getElementById("entry").innerHTML = `
    <div class="entry">

      ${e.image_url ? `<img src="${e.image_url}" alt="Bild">` : ""}

      <h2 style="text-align:center;">${e.name}</h2>

      <p style="text-align:center; font-weight:bold; margin-top:14px;">
        🎂 Geburtstag
      </p>
      <p style="text-align:center;">
        ${formatDate(e.birthday)}
      </p>

      <p style="text-align:center; font-weight:bold; margin-top:14px;">
        🍔 Lieblingsessen
      </p>
      <p style="text-align:center;">
        ${e.food || "-"}
      </p>

      <p style="text-align:center; font-weight:bold; margin-top:14px;">
        🎨 Lieblingsfarbe
      </p>
      <p style="text-align:center;">
        ${e.color || "-"}
      </p>

      ${songHtml}

      <p style="text-align:center; font-weight:bold; margin-top:16px;">
        💬 Meine Nachricht:
      </p>
      <p style="text-align:center;">
        ${e.message || ""}
      </p>

      <p style="text-align:center; opacity:0.6; margin-top:10px;">
        ${currentIndex + 1} / ${entries.length}
      </p>

    </div>
  `;
}
  // ==========================
  // NAVIGATION
  // ==========================
  document.getElementById("prev").onclick = () => {
    if (currentIndex > 0) {
      currentIndex--;
      renderEntry();
    }
  };

  document.getElementById("next").onclick = () => {
    if (currentIndex < entries.length - 1) {
      currentIndex++;
      renderEntry();
    }
  };

  loadEntries();
</script>

</body>
</html>
