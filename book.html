<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Freundschaftsbuch</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="style.css">

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="container">
    <h1>📖 Freundschaftsbuch</h1>
    <div id="book"></div>
  </div>

  <script>
    const SUPABASE_URL = "https://mvladicfytndyekrbzme.supabase.co";
    const SUPABASE_ANON_KEY =
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im12bGFkaWNmeXRuZHlla3Jiem1lIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAxMzM4MjksImV4cCI6MjA4NTcwOTgyOX0.eeTXlaU-DYqQqV5h-FaRsTigRvGKLhLVBvNHvCE2DJ4";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    function spotifyEmbed(url) {
      if (!url) return null;
      if (url.includes("spotify.com")) {
        return url.replace("open.spotify.com/", "open.spotify.com/embed/");
      }
      return null;
    }

    async function loadEntries() {
      const book = document.getElementById("book");
      book.innerHTML = "Lade Einträge …";

      const { data, error } = await supabaseClient
        .from("entries")
        .select("*");

      if (error) {
        console.error(error);
        book.innerHTML = "Fehler beim Laden";
        return;
      }

      book.innerHTML = "";

      data.forEach(entry => {
        const card = document.createElement("div");
        card.className = "entry";

        const embed = spotifyEmbed(entry.song);

        card.innerHTML = `
          ${entry.image_url ? `<img src="${entry.image_url}">` : ""}
          <h2>${entry.name}</h2>
          <p><strong>Lieblingsessen:</strong> ${entry.food || "-"}</p>
          <p><strong>Lieblingsfarbe:</strong> ${entry.color || "-"}</p>
          ${
            embed
              ? `<iframe src="${embed}" width="100%" height="80" allow="encrypted-media"></iframe>`
              : `<p><strong>Lieblingssong:</strong> ${entry.song || "-"}</p>`
          }
          <p>${entry.message || ""}</p>
        `;

        book.appendChild(card);
      });
    }

    loadEntries();
  </script>
</body>
</html>
