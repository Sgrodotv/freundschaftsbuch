<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Freundschaftsbuch</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>

<body>
  <div class="page-center">
    <div class="card">

      <h1>📖 Freundschaftsbuch</h1>

      <div id="entry">
        <p>Lade Einträge …</p>
      </div>

      <div class="nav">
        <button id="prev">⬅️</button>
        <button id="next">➡️</button>
      </div>

      <a href="index.html" class="button secondary">
        ⬅️ Zur Startseite
      </a>

    </div>
  </div>

<script>
  // ==========================
  // SUPABASE SETUP (ECHT)
  // ==========================
  const SUPABASE_URL = "https://mvladicfytndyekrbzme.supabase.co";
  const SUPABASE_KEY =
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im12bGFkaWNmeXRuZHlla3Jiem1lIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAxMzM4MjksImV4cCI6MjA4NTcwOTgyOX0.eeTXlaU-DYqQqV5h-FaRsTigRvGKLhLVBvNHvCE2DJ4";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  let entries = [];
  let currentIndex = 0;

  // ==========================
  // SPOTIFY EMBED (ROBUST)
  // ==========================
  function spotifyEmbed(url) {
    if (!url) return "";

    const match = url.match(
      /spotify\.com\/(?:intl-[a-z]{2}\/)?(track|album|playlist)\/([a-zA-Z0-9]+)/
    );

    if (!match) return "";

    return `
      <iframe
        src="https://open.spotify.com/embed/${match[1]}/${match[2]}"
        width="100%"
        height="80"
        allow="encrypted-media"
      ></iframe>
    `;
  }

  // ==========================
  // LOAD ENTRIES
  // ==========================

function formatDate(dateString) {
  if (!dateString) return "-";

  const d = new Date(dateString);
  return d.toLocaleDateString("de-DE", {
    day: "2-digit",
    month: "2-digit",
    year: "numeric"
  });
}

  
  async function loadEntries() {
    const { data, error } = await supabaseClient
      .from("entries")
      .select("*");

    if (error) {
      console.error(error);
      document.getElementById("entry").innerHTML =
        "<p>Fehler beim Laden</p>";
      return;
    }

    if (!data || data.length === 0) {
      document.getElementById("entry").innerHTML =
        "<p>Noch keine Einträge vorhanden.</p>";
      return;
    }

    entries = data;
    currentIndex = 0;
    renderEntry();
  }

  // ==========================
  // RENDER SINGLE ENTRY
  // ==========================
  function renderEntry() {
    const e = entries[currentIndex];

document.getElementById("entry").innerHTML = `
  <div class="entry">
    ${e.image_url ? `<img src="${e.image_url}" alt="Bild">` : ""}

<h2>${e.name}</h2>

<p><strong>Geburtstag:</strong> ${formatDate(e.birthday)}</p>

<p><strong>Lieblingsessen:</strong> ${e.food || "-"}</p>
<p><strong>Lieblingsfarbe:</strong> ${e.color || "-"}</p>

    ${spotifyEmbed(e.song)}

    <p>${e.message || ""}</p>

    <p style="text-align:center; opacity:0.6;">
      ${currentIndex + 1} / ${entries.length}
    </p>
  </div>
`;
  }

  // ==========================
  // NAVIGATION
  // ==========================
  document.getElementById("prev").onclick = () => {
    if (currentIndex > 0) {
      currentIndex--;
      renderEntry();
    }
  };

  document.getElementById("next").onclick = () => {
    if (currentIndex < entries.length - 1) {
      currentIndex++;
      renderEntry();
    }
  };

  loadEntries();
</script>

</body>
</html>
