<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Neuer Eintrag – Freundschaftsbuch</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="style.css">

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="container">

    <h1>Neuer Freundschafts-Eintrag</h1>

    <form id="entryForm">

      <label>
        Name
        <input type="text" id="name" required>
      </label>

      <label>
        Geburtstag
        <input type="date" id="birthday">
      </label>

      <label>
        Lieblingsessen
        <input type="text" id="food">
      </label>

      <label>
        Lieblingsfarbe
        <input type="text" id="color">
      </label>

      <label>
        Lieblingssong
        <input
          type="text"
          id="song"
          placeholder="Spotify-Link (https://open.spotify.com/...)">
      </label>

      <label>
        Nachricht
        <textarea id="message" rows="4"></textarea>
      </label>

      <label>
        Bild hochladen
        <input type="file" id="image" accept="image/*">
      </label>

      <button type="submit">Eintrag speichern</button>

    </form>

    <p id="status"></p>

    <!-- NEU -->
<a href="book.html" id="toBook" class="to-book">
  📖 Zum Freundschaftsbuch
</a>


  </div>
