<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Neuer Eintrag – Freundschaftsbuch</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>

<body>
  <h1>Neuer Freundschafts-Eintrag</h1>

  <!-- 🔴 WICHTIG: id="entryForm" -->
  <form id="entryForm">

    <label>
      Name
      <input type="text" id="name" required />
    </label>

    <label>
      Geburtstag
      <input type="date" id="birthday" />
    </label>

    <label>
      Lieblingsessen
      <input type="text" id="food" />
    </label>

    <label>
      Lieblingsfarbe
      <input type="text" id="color" />
    </label>

    <label>
      Lieblingssong (Spotify-Link)
      <input
        type="url"
        id="song"
        placeholder="https://open.spotify.com/..."
      />
    </label>

    <label>
      Nachricht
      <textarea id="message"></textarea>
    </label>

    <label>
      Bild hochladen
      <input type="file" id="image" accept="image/*" />
    </label>

    <!-- 🔴 WICHTIG: type="submit" -->
    <button type="submit">Eintrag speichern</button>
  </form>

  <!-- 🔴 Statusanzeige -->
  <p id="status"></p>

  <!-- 🔴 Weiter-Button -->
  <a href="book.html" id="toBook" style="display:none;">
    📖 Zum Freundschaftsbuch
  </a>

  <!-- Script GANZ UNTEN -->
  <script src="script.js"></script>
</body>
</html>
