<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Neuer Eintrag – Freundschaftsbuch</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="style.css">

  <!-- Supabase -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>

  <h1>Neuer Freundschafts-Eintrag</h1>

  <form id="entryForm">

    <label>
      Name
      <input type="text" id="name" required>
    </label>

    <label>
      Geburtstag
      <input type="date" id="birthday">
    </label>

    <label>
      Lieblingsessen
      <input type="text" id="food">
    </label>

    <label>
      Lieblingsfarbe
      <input type="text" id="color" placeholder="z. B. Blau">
    </label>

    <label>
      Lieblingssong
      <input
        type="text"
        id="song"
        placeholder="Spotify-Link (z. B. https://open.spotify.com/track/...)">
    </label>

    <label>
      Nachricht
      <textarea id="message" rows="4"></textarea>
    </label>

    <label>
      Bild hochladen
      <input type="file" id="image" accept="image/*">
    </label>

    <button type="submit">Eintrag speichern</button>

  </form>

  <p id="status"></p>

  <script src="script.js"></script>

</body>
</html>
